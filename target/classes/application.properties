spring.application.name=v1

# ─── Conexión MySQL ───────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tienda_db}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:database}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA / Hibernate ─────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ─── Servidor ────────────────────────────────────────────────
server.port=8080

# ─── Correo para MFA y recuperación de contraseña ────────────
# No guardes credenciales SMTP en el repositorio. Configúralas
# mediante variables de entorno en el equipo/servidor donde se ejecute.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}

# ─── IA (Groq) ───────────────────────────────────────────────
# Configura GROQ_API_KEY como variable de entorno. Si queda vacía,
# la aplicación utiliza el análisis local automático.
ia.api.url=https://api.groq.com/openai/v1/chat/completions
ia.api.key=${GROQ_API_KEY:}
ia.model=llama-3.3-70b-versatile
