name: Calidad backend

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pruebas-y-analisis:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: pruebas
          MYSQL_DATABASE: tienda_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/tienda_db?useSSL=false&allowPublicKeyRetrieval=true
      DB_USER: root
      DB_PASS: pruebas
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Dar permiso de ejecución al wrapper Maven
        run: chmod +x mvnw
      - name: Pruebas y reporte de cobertura JaCoCo
        run: ./mvnw -B verify
      - name: Análisis estático SpotBugs y FindSecBugs
        run: ./mvnw -B spotbugs:check
      - name: Preparar clave diaria de caché OWASP
        id: owasp-cache-date
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - name: Restaurar base de datos de vulnerabilidades OWASP
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/dependency-check-data
          key: ${{ runner.os }}-owasp-dc-13.0.0-${{ hashFiles('**/pom.xml') }}-${{ steps.owasp-cache-date.outputs.date }}
          restore-keys: |
            ${{ runner.os }}-owasp-dc-13.0.0-${{ hashFiles('**/pom.xml') }}-
      - name: Análisis de dependencias OWASP
        run: |
          DATA_DIR="$RUNNER_TEMP/dependency-check-data"
          mkdir -p "$DATA_DIR"
          if [ -n "$NVD_API_KEY" ]; then
            ./mvnw -B org.owasp:dependency-check-maven:13.0.0:check -DnvdApiKey="$NVD_API_KEY" -DdataDirectory="$DATA_DIR" -DnvdValidForHours=24
          else
            ./mvnw -B org.owasp:dependency-check-maven:13.0.0:check -DdataDirectory="$DATA_DIR" -DnvdValidForHours=24
          fi
      - name: Subir reportes de calidad
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-calidad-backend
          if-no-files-found: warn
          path: |
            target/site/jacoco/**
            target/spotbugsXml.xml
            target/dependency-check-report.html
            target/dependency-check-report.json

  deteccion-secretos:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
