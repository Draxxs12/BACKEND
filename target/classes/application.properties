spring.application.name=v1

# ─── Conexión MySQL ───────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tienda_db}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:database}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA / Hibernate ─────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# ─── Servidor ────────────────────────────────────────────────
server.port=8080

# Observabilidad (Spring Boot Actuator)
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized

# ─── Gmail API (OAuth 2.0) ───────────────────────────────────
# La cuenta configurada aquí es SOLO la cuenta emisora.
# Los destinatarios se obtienen automáticamente del email
# almacenado para cada usuario en la base de datos.
google.application-name=Ferretería Charito
google.gmail.client-id=${GOOGLE_GMAIL_CLIENT_ID:}
google.gmail.client-secret=${GOOGLE_GMAIL_CLIENT_SECRET:}
google.gmail.refresh-token=${GOOGLE_GMAIL_REFRESH_TOKEN:}
google.gmail.sender-email=${GOOGLE_GMAIL_SENDER_EMAIL:}

# ─── IA (Groq) ───────────────────────────────────────────────
ia.api.url=https://api.groq.com/openai/v1/chat/completions
ia.api.key=${GROQ_API_KEY:}
ia.model=llama-3.3-70b-versatile
