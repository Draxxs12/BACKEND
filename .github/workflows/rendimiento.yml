name: Rendimiento

on:
  pull_request:                 # humo en cada PR
  schedule:
    - cron: '0 6 * * *'         # carga nocturna (01:00 hora de Lima)
  workflow_dispatch:            # estrés y picos, solo bajo demanda
    inputs:
      escenario:
        description: 'Escenario a ejecutar'
        required: true
        default: carga
        type: choice
        options: [humo, carga, pico, estres, reportes]

jobs:
  rendimiento:
    runs-on: ubuntu-latest
    timeout-minutes: 60         # la resistencia de 8 h NO va aquí: se ejecuta en una máquina dedicada
    services:
      mysql:
        image: mysql:8.0
        env: { MYSQL_ROOT_PASSWORD: pruebas, MYSQL_DATABASE: tienda_db }
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1" --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/tienda_db?useSSL=false&allowPublicKeyRetrieval=true
      DB_USER: root
      DB_PASS: pruebas
      # Clave exclusiva para CI; nunca reutilizar la clave de producción.
      JWT_SECRET: ${{ secrets.JWT_SECRET_PRUEBAS }}
      # Cuenta efímera creada en la base de datos aislada de este job.
      EMAIL: ci-admin@ferreteria.test
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: maven }
      - name: Token de administrador para las pruebas (sin código MFA)
        run: |
          TOKEN=$(python3 k6/generar_token.py)
          echo "::add-mask::$TOKEN"
          echo "TOKEN=$TOKEN" >> "$GITHUB_ENV"
      - name: Levantar el backend
        timeout-minutes: 8
        run: |
          chmod +x mvnw
          ./mvnw -B -DskipTests package
          nohup java -jar target/*.jar > backend.log 2>&1 &
          APP_PID=$!
          echo "Esperando a que el backend quede listo (PID $APP_PID)..."
          for i in $(seq 1 60); do
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              echo "El proceso Java terminó antes de quedar listo. Últimas líneas de backend.log:"
              tail -80 backend.log; exit 1
            fi
            CODIGO=$(curl -s -m 5 -o /dev/null -w '%{http_code}' http://localhost:8080/actuator/health/readiness || true)
            echo "intento $i: HTTP ${CODIGO:-sin respuesta}"
            [ "$CODIGO" = "200" ] && break
            if [ $((i % 10)) -eq 0 ]; then echo "--- backend.log (últimas 15 líneas)"; tail -15 backend.log; fi
            sleep 3
          done
          if [ "$CODIGO" != "200" ]; then
            echo "El backend no quedó listo (último código: ${CODIGO:-sin respuesta}). Últimas líneas de backend.log:"
            tail -80 backend.log; exit 1
          fi
      - name: Crear administrador efímero para pruebas
        env:
          MYSQL_PWD: pruebas
        run: |
          mysql --protocol=TCP -h127.0.0.1 -uroot tienda_db <<'SQL'
          INSERT INTO usuarios (nombre, email, password_hash, rol_id, activo, created_at, registrado_por)
          SELECT 'Administrador CI', 'ci-admin@ferreteria.test',
                 (SELECT password_hash FROM usuarios WHERE activo = 1 ORDER BY id LIMIT 1),
                 r.id, TRUE, NOW(), 'CI'
          FROM roles r
          WHERE r.nombre = 'Administrador'
          ON DUPLICATE KEY UPDATE rol_id = VALUES(rol_id), activo = TRUE;
          SQL
          ROL=$(mysql --protocol=TCP -N -h127.0.0.1 -uroot tienda_db -e "SELECT UPPER(r.nombre) FROM usuarios u JOIN roles r ON r.id = u.rol_id WHERE u.email = 'ci-admin@ferreteria.test' AND u.activo = 1 LIMIT 1;")
          if [ "$ROL" != "ADMINISTRADOR" ]; then
            echo "No se pudo preparar el usuario administrador efímero (rol encontrado: ${ROL:-ninguno})."
            exit 1
          fi
      - name: Preparar el producto de prueba (stock alto para no agotarlo durante la carga)
        env:
          MYSQL_PWD: pruebas
        run: mysql --protocol=TCP -h127.0.0.1 -uroot tienda_db -e "UPDATE productos SET stock = 1000000 WHERE id = 1;"
      - uses: grafana/setup-k6-action@v1
      - name: Ejecutar escenario k6
        env:
          PRODUCTO_ID: '1'
          CLIENTE_ID: '1'
          USUARIO_ID: '1'
        run: |
          ESC="${{ github.event.inputs.escenario || (github.event_name == 'schedule' && 'carga' || 'humo') }}"
          case "$ESC" in
            humo)   FILE=k6/humo.js ;;
            carga)  FILE=k6/busqueda_productos.js ;;
            pico)   FILE=k6/venta_pico.js ;;
            estres) FILE=k6/estres.js ;;
            reportes) FILE=k6/reportes_volumen.js ;;
            *) echo "Escenario no reconocido: $ESC"; exit 1 ;;
          esac
          k6 run --summary-export=resumen-k6.json "$FILE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reportes-rendimiento
          path: |
            resumen-k6.json
            backend.log
